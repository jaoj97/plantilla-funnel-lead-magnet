<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cargando…</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="config.js"></script>
  <script src="comun.js"></script>
  <script src="pixel.js"></script>
</head>
<body>
  <main class="pagina">
    <div class="marca">
      <img id="marca-logo" alt="" hidden>
      <span id="marca-nombre"></span>
    </div>

    <header class="cabeza">
      <p class="antetitulo" id="antetitulo"></p>
      <h1 id="titulo"></h1>
      <p class="bajada" id="bajada"></p>
    </header>

    <section class="cuestionario" aria-label="Cuestionario">
      <div class="riel-cabeza">
        <span class="riel-texto" id="riel-texto" aria-live="polite"></span>
      </div>
      <div class="riel" id="riel" aria-hidden="true"></div>
      <div id="cuestionario-cuerpo"></div>
      <p class="aviso-parcial" id="aviso-parcial"></p>
    </section>

    <section class="detalle" aria-labelledby="incluye-titulo">
      <h2 id="incluye-titulo"></h2>
      <ul class="incluye" id="incluye"></ul>
      <div class="video" id="video" hidden></div>
    </section>
  </main>
  <noscript>Para responder el cuestionario necesitas activar JavaScript en tu navegador.</noscript>
  <script src="landing.js"></script>
</body>
</html>
